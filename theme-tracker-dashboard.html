<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Stock Theme & Sub-Theme Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root, [data-theme="light"] {
  --color-bg: #0e1117;
  --color-surface: #141820;
  --color-surface-2: #1a2030;
  --color-surface-offset: #1e2535;
  --color-surface-offset-2: #232b3e;
  --color-surface-dynamic: #2a3348;
  --color-divider: #2d3650;
  --color-border: #354060;
  --color-text: #e8ecf4;
  --color-text-muted: #8892aa;
  --color-text-faint: #4a5470;
  --color-text-inverse: #0e1117;
  --color-primary: #3b82f6;
  --color-primary-hover: #2563eb;
  --color-primary-highlight: #1e3a5f;
  --color-success: #22c55e;
  --color-success-muted: #16a34a;
  --color-success-bg: #0f2b1a;
  --color-error: #ef4444;
  --color-error-muted: #dc2626;
  --color-error-bg: #2b0f0f;
  --color-warning: #f59e0b;
  --color-gold: #f59e0b;
  --color-orange: #fb923c;
  --color-purple: #a78bfa;
  --color-teal: #2dd4bf;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-display: 'Instrument Serif', Georgia, serif;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* ===================== BASE RESET ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  background: var(--color-bg);
  color: var(--color-text);
  min-height: 100dvh;
  line-height: 1.6;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* ===================== LAYOUT ===================== */
.app-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr;
  min-height: 100dvh;
}

/* ===================== HEADER ===================== */
.app-header {
  grid-column: 1 / -1;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 700;
  font-size: var(--text-base);
  color: var(--color-text);
  letter-spacing: -0.02em;
}
.logo svg { color: var(--color-primary); }
.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
.market-status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-text-muted);
}
.market-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--color-success);
  box-shadow: 0 0 6px var(--color-success);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.timeframe-group {
  display: flex;
  gap: var(--space-1);
  background: var(--color-surface-offset);
  padding: var(--space-1);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
}
.tf-btn {
  padding: var(--space-1) var(--space-3);
  border-radius: calc(var(--radius-md) - 2px);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-muted);
  transition: all var(--transition);
  white-space: nowrap;
}
.tf-btn:hover { color: var(--color-text); }
.tf-btn.active {
  background: var(--color-primary);
  color: white;
  box-shadow: 0 2px 8px rgba(59,130,246,0.4);
}
.last-updated {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}

/* ===================== SIDEBAR ===================== */
.sidebar {
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  overflow-y: auto;
  padding: var(--space-4) 0;
}
.sidebar-section-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-faint);
  padding: var(--space-4) var(--space-4) var(--space-2);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  border-radius: 0;
  cursor: pointer;
  transition: all var(--transition);
  border-left: 3px solid transparent;
  position: relative;
}
.nav-item:hover {
  color: var(--color-text);
  background: var(--color-surface-offset);
}
.nav-item.active {
  color: var(--color-primary);
  background: color-mix(in oklch, var(--color-primary) 10%, var(--color-surface));
  border-left-color: var(--color-primary);
}
.nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
.nav-badge {
  margin-left: auto;
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  background: var(--color-surface-offset-2);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}

/* ===================== MAIN CONTENT ===================== */
.main-content {
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-6);
  background: var(--color-bg);
}

/* ===================== PAGE HEADER ===================== */
.page-title-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: var(--space-6);
  gap: var(--space-4);
}
.page-title { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.page-subtitle { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
.view-toggle {
  display: flex;
  gap: var(--space-1);
  background: var(--color-surface-offset);
  padding: 3px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  flex-shrink: 0;
}
.view-btn {
  padding: 5px 10px;
  border-radius: calc(var(--radius-md) - 1px);
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 5px;
}
.view-btn.active {
  background: var(--color-surface-2);
  color: var(--color-text);
  box-shadow: var(--shadow-sm);
}

/* ===================== KPI ROW ===================== */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.kpi-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.kpi-card.bullish::before { background: linear-gradient(90deg, var(--color-success), transparent); }
.kpi-card.bearish::before { background: linear-gradient(90deg, var(--color-error), transparent); }
.kpi-card.neutral::before { background: linear-gradient(90deg, var(--color-primary), transparent); }
.kpi-card.warning::before { background: linear-gradient(90deg, var(--color-warning), transparent); }
.kpi-label {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: var(--space-2);
}
.kpi-value {
  font-size: var(--text-lg);
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-delta {
  font-size: var(--text-xs);
  margin-top: var(--space-1);
  font-weight: 500;
}
.kpi-delta.up { color: var(--color-success); }
.kpi-delta.down { color: var(--color-error); }
.kpi-delta.flat { color: var(--color-text-muted); }

/* ===================== GRID VIEWS ===================== */
.themes-heatmap {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}
.theme-heatmap-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.theme-heatmap-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: color-mix(in oklch, var(--color-primary) 40%, var(--color-border));
}
.theme-heatmap-card.strong-up { background: color-mix(in oklch, var(--color-success) 12%, var(--color-surface)); border-color: color-mix(in oklch, var(--color-success) 25%, var(--color-border)); }
.theme-heatmap-card.mild-up { background: color-mix(in oklch, var(--color-success) 6%, var(--color-surface)); border-color: color-mix(in oklch, var(--color-success) 12%, var(--color-border)); }
.theme-heatmap-card.mild-down { background: color-mix(in oklch, var(--color-error) 6%, var(--color-surface)); border-color: color-mix(in oklch, var(--color-error) 12%, var(--color-border)); }
.theme-heatmap-card.strong-down { background: color-mix(in oklch, var(--color-error) 12%, var(--color-surface)); border-color: color-mix(in oklch, var(--color-error) 25%, var(--color-border)); }

.theme-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-2);
  letter-spacing: -0.01em;
}
.theme-change {
  font-size: var(--text-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.theme-change.up { color: var(--color-success); }
.theme-change.down { color: var(--color-error); }
.theme-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: var(--space-2);
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-divider);
}
.theme-rank {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
}
.theme-stocks-count {
  font-size: var(--text-xs);
  color: var(--color-text-faint);
}
.theme-sparkline { height: 32px; margin: var(--space-2) 0; }
.theme-momentum-bar {
  height: 3px;
  border-radius: var(--radius-full);
  background: var(--color-surface-dynamic);
  overflow: hidden;
  margin-top: var(--space-2);
}
.theme-momentum-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
}

/* ===================== TABLE VIEW ===================== */
.table-container {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  overflow: hidden;
}
.data-table {
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
}
.data-table thead {
  background: var(--color-surface-offset);
  border-bottom: 1px solid var(--color-border);
}
.data-table th {
  padding: var(--space-3) var(--space-4);
  text-align: left;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
  font-size: 0.7rem;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.data-table th:hover { color: var(--color-text); }
.data-table th .sort-icon { display: inline; opacity: 0.4; margin-left: 2px; }
.data-table td {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-divider);
  vertical-align: middle;
}
.data-table tbody tr {
  cursor: pointer;
  transition: background var(--transition);
}
.data-table tbody tr:hover { background: var(--color-surface-offset); }
.data-table tbody tr:last-child td { border-bottom: none; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.pill.up { background: var(--color-success-bg); color: var(--color-success); }
.pill.down { background: var(--color-error-bg); color: var(--color-error); }
.pill.neutral { background: var(--color-surface-dynamic); color: var(--color-text-muted); }
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  background: var(--color-surface-dynamic);
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--color-text-muted);
}
.rank-badge.top3 { background: color-mix(in oklch, var(--color-gold) 20%, var(--color-surface-dynamic)); color: var(--color-gold); }
.change-bar-cell { min-width: 100px; }
.change-bar-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.change-bar-bg {
  flex: 1;
  height: 4px;
  background: var(--color-surface-dynamic);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.change-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  transition: width 1s cubic-bezier(0.16,1,0.3,1);
}
.change-value {
  min-width: 52px;
  text-align: right;
  font-weight: 600;
}
.change-value.up { color: var(--color-success); }
.change-value.down { color: var(--color-error); }

/* ===================== DETAIL PANEL ===================== */
.detail-panel {
  display: none;
  position: fixed;
  top: 56px; right: 0;
  width: 420px;
  height: calc(100dvh - 56px);
  background: var(--color-surface);
  border-left: 1px solid var(--color-border);
  z-index: 200;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
}
.detail-panel.open {
  display: block;
  transform: translateX(0);
}
.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  background: var(--color-surface);
  z-index: 10;
}
.detail-close {
  width: 32px; height: 32px;
  border-radius: var(--radius-md);
  background: var(--color-surface-offset);
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted);
  transition: all var(--transition);
}
.detail-close:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.detail-body { padding: var(--space-5) var(--space-6); }
.detail-section-title {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-faint);
  margin-bottom: var(--space-3);
  margin-top: var(--space-5);
}
.subtheme-list { display: flex; flex-direction: column; gap: var(--space-2); }
.subtheme-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-3);
  background: var(--color-surface-offset);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-divider);
  cursor: pointer;
  transition: all var(--transition);
}
.subtheme-row:hover { background: var(--color-surface-offset-2); border-color: var(--color-border); }
.subtheme-name { font-size: var(--text-sm); font-weight: 500; flex: 1; }
.subtheme-change { font-size: var(--text-sm); font-weight: 700; font-variant-numeric: tabular-nums; }
.stocks-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-2);
  margin-top: var(--space-3);
}
.stock-chip {
  background: var(--color-surface-offset);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all var(--transition);
  cursor: pointer;
}
.stock-chip:hover { background: var(--color-surface-offset-2); border-color: var(--color-border); }
.stock-ticker { font-size: var(--text-xs); font-weight: 700; color: var(--color-primary); }
.stock-name { font-size: 0.65rem; color: var(--color-text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
.stock-price-change { font-size: var(--text-xs); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.stock-price-change.up { color: var(--color-success); }
.stock-price-change.down { color: var(--color-error); }

/* ===================== CHART AREA ===================== */
.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.chart-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-5);
}
.chart-card-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-1);
}
.chart-card-sub {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-bottom: var(--space-4);
}
.chart-wrapper { position: relative; height: 200px; }

/* ===================== ROTATION ALERT ===================== */
.rotation-section { margin-bottom: var(--space-6); }
.rotation-title {
  font-size: var(--text-sm);
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: var(--space-3);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.rotation-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}
.rotation-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
}
.rotation-card.gaining { border-left: 3px solid var(--color-success); }
.rotation-card.losing { border-left: 3px solid var(--color-error); }
.rotation-card-title {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: var(--space-3);
}
.rotation-card.gaining .rotation-card-title { color: var(--color-success); }
.rotation-card.losing .rotation-card-title { color: var(--color-error); }
.rotation-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--color-divider);
  font-size: var(--text-xs);
}
.rotation-item:last-child { border-bottom: none; }
.rotation-item-name { color: var(--color-text-muted); }
.rotation-item-change { font-weight: 700; font-variant-numeric: tabular-nums; }
.rotation-item-change.up { color: var(--color-success); }
.rotation-item-change.down { color: var(--color-error); }

/* ===================== BREADCRUMB ===================== */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  margin-bottom: var(--space-5);
}
.breadcrumb a { cursor: pointer; transition: color var(--transition); }
.breadcrumb a:hover { color: var(--color-primary); }
.breadcrumb-sep { opacity: 0.4; }

/* ===================== SEARCH ===================== */
.search-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-2) var(--space-3);
  margin-bottom: var(--space-5);
  transition: border-color var(--transition);
}
.search-bar:focus-within { border-color: var(--color-primary); }
.search-bar svg { color: var(--color-text-faint); flex-shrink: 0; }
.search-input {
  background: none;
  border: none;
  outline: none;
  color: var(--color-text);
  font-size: var(--text-sm);
  font-family: var(--font-body);
  width: 100%;
}
.search-input::placeholder { color: var(--color-text-faint); }

/* ===================== SKELETON ===================== */
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--color-surface-offset) 25%, var(--color-surface-dynamic) 50%, var(--color-surface-offset) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius-sm);
}

/* ===================== SCROLLBAR ===================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--color-bg); }
::-webkit-scrollbar-thumb { background: var(--color-surface-dynamic); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--color-border); }

/* ===================== OVERLAY ===================== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  backdrop-filter: blur(2px);
}
.overlay.active { display: block; }

/* ===================== MOMENTUM SIGNALS ===================== */
.signal-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.signal-badge.breakout { background: color-mix(in oklch, var(--color-primary) 15%, var(--color-surface-dynamic)); color: var(--color-primary); }
.signal-badge.accelerating { background: color-mix(in oklch, var(--color-success) 15%, var(--color-surface-dynamic)); color: var(--color-success); }
.signal-badge.fading { background: color-mix(in oklch, var(--color-warning) 15%, var(--color-surface-dynamic)); color: var(--color-warning); }
.signal-badge.reversing { background: color-mix(in oklch, var(--color-error) 15%, var(--color-surface-dynamic)); color: var(--color-error); }

/* ===================== TABS ===================== */
.tab-row {
  display: flex;
  gap: var(--space-1);
  border-bottom: 1px solid var(--color-border);
  margin-bottom: var(--space-5);
}
.tab-btn {
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all var(--transition);
}
.tab-btn:hover { color: var(--color-text); }
.tab-btn.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 1024px) {
  .app-layout { grid-template-columns: 200px 1fr; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .chart-row { grid-template-columns: 1fr; }
  .detail-panel { width: 360px; }
}
@media (max-width: 768px) {

function getChange(theme, tf) {

  if (val > 1.5) return "strong-up";

}
function changeDisplay(val, includeSign = true) {

function changeColorClass(val) { return val >= 0 ? "up" : "down"; }
function momentumBadge(m) {

    breakout: '<span class="signal-badge breakout">⚡ Breakout</span>',

    fading: '<span class="signal-badge fading">◼ Fading</span>',
    reversing: '<span class="signal-badge reversing">▼ Reversing</span>',
  };
  return map[m] || "";
}
function rankOf(themes, theme) {
  const sorted = [...themes].sort((a, b) => getChange(b, currentTF) - getChange(a, currentTF));

}
function getBarWidth(val, maxAbs) {

  let prices = [100];
  for (let i = 1; i < length; i++) {
    prices.push(prices[i-1] + (Math.random() - 0.45) * 3);
  }
  const last = prices[prices.length - 1];
  const target = 100 + baseVal * 0.6;
  const scale = target / last;
  prices = prices.map(p => p * scale);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = max - min || 1;
  const w = 72, h = 28;
  const pts = prices.map((p, i) => {
    const x = (i / (length - 1)) * w;
    const y = h - ((p - min) / range) * h;
    return `${x},${y}`;
  });
  return `M ${pts.join(" L ")}`;

  const path = generateSparkPath(val);
  return `<svg viewBox="0 0 72 28" preserveAspectRatio="none" style="width:100%;height:100%;"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`;
}
function formatTime() {
  const now = new Date();
  return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

        rows.push({ theme, sub });

  rows.sort((a, b) => getChange(b.sub, currentTF) - getChange(a.sub, currentTF));

// ===================== DETAIL PANEL =====================
function openDetail(themeId) {
  const theme = THEMES_DATA.find(t => t.id === themeId);
  if (!theme) return;
  currentThemeId = themeId;
  const val = getChange(theme, currentTF);
  document.getElementById("detailTitle").textContent = `${theme.icon} ${theme.name}`;
  document.getElementById("detailMeta").innerHTML = `${changeDisplay(val)} ${currentTF} &nbsp;•&nbsp; ${momentumBadge(theme.momentum)}`;
  document.getElementById("detailBody").innerHTML = `
    <div class="detail-section-title">Sub-Theme Breakdown</div>
    <div class="subtheme-list">
      ${theme.subthemes.map(s => {
        const sv = getChange(s, currentTF);
        return `
          <div class="subtheme-row">
            <div class="subtheme-name">${s.name}</div>
            <div class="subtheme-change ${changeColorClass(sv)}">${changeDisplay(sv)}</div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="detail-section-title">Key Stocks in Theme</div>
    <div class="stocks-grid">
      ${theme.subthemes.flatMap(s => s.stocks.slice(0,3).map(ticker => {
        const sv = getChange(s, currentTF);
        const noise = (Math.random() - 0.45) * 1.5;
        const stockChange = sv + noise;
        return `
          <div class="stock-chip">
            <div>
              <div class="stock-ticker">${ticker}</div>
              <div class="stock-name">${s.name}</div>
            </div>
            <div class="stock-price-change ${changeColorClass(stockChange)}">${changeDisplay(stockChange)}</div>
          </div>
        `;
      })).slice(0, 12).join('')}
    </div>
    <div class="detail-section-title">Timeframe Comparison</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-2)">
      ${["1D","1W","1M","YTD"].map(tf => {
        const v = getChange(theme, tf);
        return `
          <div style="background:var(--color-surface-offset);border-radius:var(--radius-md);padding:var(--space-3);text-align:center;border:1px solid var(--color-divider)">
            <div style="font-size:0.65rem;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.05em">${tf}</div>
            <div style="font-size:var(--text-sm);font-weight:700;margin-top:4px;color:${v>=0?'var(--color-success)':'var(--color-error)'}">${changeDisplay(v)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  document.getElementById("detailPanel").classList.add("open");
  document.getElementById("overlay").classList.add("active");
}

function closeDetail() {
  document.getElementById("detailPanel").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
  currentThemeId = null;
}

// ===================== CHARTS =====================
function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
}

function renderCharts() {
  const sorted = [...THEMES_DATA].sort((a, b) => getChange(b, currentTF) - getChange(a, currentTF));

  if (document.getElementById("barChart")) {
    const vals = sorted.map(t => getChange(t, currentTF));
    chartInstances.bar = new Chart(document.getElementById("barChart"), {
      type: "bar",
      data: {
        labels: sorted.map(t => t.icon + " " + t.name.split(' ')[0]),
        datasets: [{
          data: vals,
          backgroundColor: vals.map(v => v >= 0 ? "rgba(34,197,94,0.7)" : "rgba(239,68,68,0.7)"),
          borderColor: vals.map(v => v >= 0 ? "rgba(34,197,94,1)" : "rgba(239,68,68,1)"),
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 700 },
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => changeDisplay(ctx.raw) }
        }},
        scales: {
          x: { ticks: { color: "#8892aa", font: { size: 9 }, maxRotation: 45 }, grid: { color: "rgba(53,64,96,0.5)" } },
          y: { ticks: { color: "#8892aa", font: { size: 10 }, callback: v => v + "%" }, grid: { color: "rgba(53,64,96,0.5)" } }
        }
      }
    });
  }

  if (document.getElementById("doughnutChart")) {
    const momentumCounts = { breakout: 0, accelerating: 0, fading: 0, reversing: 0 };
    THEMES_DATA.forEach(t => momentumCounts[t.momentum]++);
    chartInstances.donut = new Chart(document.getElementById("doughnutChart"), {
      type: "doughnut",
      data: {
        labels: ["Breakout", "Accelerating", "Fading", "Reversing"],
        datasets: [{
          data: Object.values(momentumCounts),
          backgroundColor: ["rgba(59,130,246,0.8)","rgba(34,197,94,0.8)","rgba(245,158,11,0.8)","rgba(239,68,68,0.8)"],
          borderColor: "#141820", borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 700 },
        plugins: {
          legend: { position: "right", labels: { color: "#8892aa", font: { size: 11 }, padding: 12 } }
        },
        cutout: "65%"
      }
    });
  }

  if (document.getElementById("rotationChart")) {
    const sorted2 = [...THEMES_DATA].sort((a, b) => getChange(b, currentTF) - getChange(a, currentTF));
    const vals = sorted2.map(t => getChange(t, currentTF));
    chartInstances.rotation = new Chart(document.getElementById("rotationChart"), {
      type: "bar",
      data: {
        labels: sorted2.map(t => t.icon + " " + t.name.split(' ')[0]),
        datasets: [{
          label: `${currentTF} %`,
          data: vals,
          backgroundColor: vals.map(v => v >= 0 ? "rgba(34,197,94,0.6)" : "rgba(239,68,68,0.6)"),
          borderColor: vals.map(v => v >= 0 ? "rgb(34,197,94)" : "rgb(239,68,68)"),
          borderWidth: 1.5,
          borderRadius: 5,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: { duration: 800 },
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8892aa", font: { size: 9 }, maxRotation: 40 }, grid: { color: "rgba(53,64,96,0.4)" } },
          y: { ticks: { color: "#8892aa", font: { size: 10 }, callback: v => v + "%" }, grid: { color: "rgba(53,64,96,0.4)" } }
        }
      }
    });
  }
}

// ===================== NAVIGATION =====================
function switchPage(page, el) {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  if (el) el.classList.add("active");
  currentPage = page;
  renderPage();
}

function renderPage() {
  destroyCharts();
  const main = document.getElementById("mainContent");
  switch(currentPage) {
    case "overview": main.innerHTML = renderOverview(); break;
    case "heatmap": main.innerHTML = renderHeatmap(); break;
    case "rotation": main.innerHTML = renderRotation(); break;
    case "subthemes": main.innerHTML = renderSubthemes(); break;
    case "stocks": main.innerHTML = renderTopStocks(); break;
    case "breakouts": main.innerHTML = renderBreakouts(); break;
    default: main.innerHTML = renderOverview();
  }
  setTimeout(renderCharts, 50);
}

// ===================== TIMEFRAME =====================
document.getElementById("tfGroup").addEventListener("click", e => {
  const btn = e.target.closest(".tf-btn");
  if (!btn) return;
  document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTF = btn.dataset.tf;
  renderPage();
});

// ===================== SEARCH =====================
function filterSubthemes(val) {
  document.getElementById("subthemeTableContainer").innerHTML = renderSubthemeTable(val);
}

// ===================== CLOCK & STATUS =====================
function updateClock() {
  const now = new Date();
  const hour = now.getHours(), min = now.getMinutes();
  const isWeekday = now.getDay() >= 1 && now.getDay() <= 5;
  const isMarketHours = isWeekday && ((hour > 9 || (hour === 9 && min >= 30)) && hour < 16);
  const dot = document.querySelector(".market-dot");
  const statusText = document.getElementById("marketStatusText");
  if (dot && statusText) {
    if (isMarketHours) {
      dot.style.background = "var(--color-success)";
      dot.style.boxShadow = "0 0 6px var(--color-success)";
      statusText.textContent = "Market Open";
    } else {
      dot.style.background = "var(--color-warning)";
      dot.style.boxShadow = "0 0 6px var(--color-warning)";
      statusText.textContent = "Market Closed";
    }
  }
  const lu = document.getElementById("lastUpdated");
  if (lu) lu.textContent = "Updated " + formatTime();
}
setInterval(updateClock, 1000);
updateClock();

// ===================== INIT =====================
renderPage();
</script>
</body>
